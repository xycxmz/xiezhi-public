# Audit follow-up probes: benign operations that must stay clean after the
# rule fixes, plus new attack forms the fixes must now catch. Driven through
# the same r5check replay harness (wrapper + direct events per case).
false_positives:
  - id: BP01
    tactic: TA0002
    technique: T0000
    name: curl pipe to sha256sum checksum verify
    cmd: 'curl -s https://dl.example.com/file.tar.gz | sha256sum'
    creates_process: false
    expected_rules: []
    intent_tags: []
    expect: silent
    severity_hint: ''
  - id: BP02
    tactic: TA0002
    technique: T0000
    name: wget pipe shasum verify
    cmd: 'wget -q -O - http://203.0.113.10/file | shasum -c -'
    creates_process: false
    expected_rules: []
    intent_tags: []
    expect: silent
    severity_hint: ''
  - id: BP03
    tactic: TA0010
    technique: T0000
    name: scp backup archive to vault
    cmd: 'scp /data/backup.tar.gz ops@vault:/backup/'
    creates_process: false
    expected_rules: []
    intent_tags: []
    expect: silent
    severity_hint: ''
  - id: BP04
    tactic: TA0010
    technique: T0000
    name: rsync archive to nas
    cmd: 'rsync -az /srv/site-20261113.tar.gz backup@nas:/pool/'
    creates_process: false
    expected_rules: []
    intent_tags: []
    expect: silent
    severity_hint: ''
  - id: BP05
    tactic: TA0009
    technique: T0000
    name: nightly pg_dump backup
    cmd: 'pg_dump -U postgres appdb > /backup/appdb-20261113.sql'
    creates_process: false
    expected_rules: exec-dump-database
    intent_tags: []
    expect: silent
    severity_hint: ''
  - id: BP06
    tactic: TA0002
    technique: T0000
