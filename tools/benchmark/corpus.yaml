# xiezhi R4 benchmark corpus.
# 75 interleaved attack cases (12 ATT&CK tactics) + 3 kill-chain groups (12
# cases, shared intent buckets) + 15 false-positive ops.
#
# Field semantics (frozen; corpus.py parses this subset of YAML):
#   id              unique case id
#   tactic          ATT&CK tactic id (TA....)
#   technique       ATT&CK technique id (hint, not matched by engine)
#   name            short description (ASCII only)
#   cmd             shell command. The runner ALWAYS executes it as
#                   `timeout N setpriv --reuid=UID ... bash -c "<cmd>"`, so
#                   the full command string lands in one argv element. That is
#                   the only argv shape in which the per-element regex rules
#                   and the intent labeler can see multi-token patterns such
#                   as pipes or flag combinations. Interactive/bare-script
#                   execution of these commands is NOT what this corpus
#                   measures.
#   creates_process true  = attack tool binary ships with stock CentOS 7
#                   minimal and really execve()s (its own event is expected).
#                   false = binary missing on minimal (argv-visible
#                   simulation only) or pure shell builtin (echo redirect,
#                   history, unset). Both sub-forms stay argv-visible through
#                   the bash -c wrapper; kernel hooks cannot see them in an
#                   interactive shell - that is the documented known boundary.
#   mode            real | sim-missing-bin | sim-builtin (detail for the above)
#   bin             primary binary probed by the runner (informational)
#   expected_rules  rule ids expected to alert for THIS case in isolation
#                   (seed rules are per-event; intent/<tag> appears here only
#                   when the case alone crosses the 8.0 bucket threshold, or
#                   for the crossing case of a chain bucket)
#   intent_tags     labeler tags the command should register (informational;
#                   tags without a policy score or below 8.0 total never
#                   alert on their own)
#   bucket          optional shared intent bucket (kill-chain group). Cases
#                   sharing a bucket run under one uid so tags accumulate.
#   expect          detectable  = expected_rules non-empty, a hit is required
#                   gap         = no rule can fire for this case in isolation
#                                (coverage hole or below-threshold intent)
#                   silent      = false-positive op, NO high+ alert allowed
#
# Execution order = file order: false_positives first (clean buckets), then
# interleaved attack cases (round-robin over tactics, keeps same-rule cases
# apart so the 10 alerts/min/rule engine limiter never clips), then chains.

