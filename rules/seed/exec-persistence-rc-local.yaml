id: exec-persistence-rc-local
type: field
event: EXECVE
severity: high
mitre: T1037.004
match:
  logic: or
  conditions:
    - op: REGEX
      field: execve.proc.argv
      value: '(>>|tee\s+-a)[^;|]*\s*/etc/(rc\.local|rc\.d|init\.d)'
    - op: REGEX
      field: execve.proc.argv
      value: '(>>|>)\s*/etc/(rc\.local|rc\.d|init\.d)'
action: alert
