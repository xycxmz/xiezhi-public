id: exec-auditd-tamper
type: field
event: EXECVE
severity: critical
mitre: T1562.002
match:
  logic: or
  conditions:
    - op: REGEX
      field: execve.proc.argv
      value: '(rm|shred|mv|truncate|dd)\s+[^;|]*audit\.log'
    - op: REGEX
      field: execve.proc.argv
      value: '>\s*\S*audit\.log|>\s*/var/log/audit'
    - op: REGEX
      field: execve.proc.argv
      value: 'systemctl\s+[^;|]*(stop|disable|mask|kill)\s+(auditd|rsyslogd?|syslog(-ng)?)'
    - op: REGEX
      field: execve.proc.argv
      value: 'service\s+(auditd|rsyslogd?|syslog(-ng)?)\s+(stop|disable|restart)|pkill\s+[^;|]*auditd|killall\s+auditd'
    - op: REGEX
      field: execve.proc.argv
      value: 'auditctl\s+[^;|]*-e\s+0'
action: alert
