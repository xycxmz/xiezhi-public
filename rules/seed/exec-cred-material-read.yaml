id: exec-cred-material-read
type: field
event: EXECVE
severity: medium
mitre: T1552.001
match:
  logic: or
  conditions:
    - op: REGEX
      field: execve.proc.argv
      value: '/root/\.(ssh|aws|kube)|/home/[^/]+/\.(ssh|aws|kube)|id_rsa([^.]|$)|authorized_keys|\.git-credentials'
    - op: REGEX
      field: execve.proc.argv
      value: '(cat|grep|head|tail|less|more|find).*(\.env|\.pem|\.key|\.pfx)\b'
action: alert
