id: exec-cred-metadata-creds
type: field
event: EXECVE
severity: critical
mitre: T1552.005
match:
  logic: or
  conditions:
    - op: REGEX
      field: execve.proc.argv
      value: '(100\.100\.100\.200|169\.254\.169\.254)[^;|]*/latest/[^;|]*(iam|ram|security-credentials|user-data|dynamic)'
    - op: REGEX
      field: execve.proc.argv
      value: '/latest/(security-credentials|user-data|dynamic/iam-role)'
action: alert
