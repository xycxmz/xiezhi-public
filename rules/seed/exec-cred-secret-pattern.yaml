id: exec-cred-secret-pattern
type: field
event: EXECVE
severity: medium
mitre: T1552.001
match:
  logic: or
  conditions:
    - op: REGEX
      field: execve.proc.argv
      value: 'AWS_SECRET_ACCESS_KEY|aws_access_key_id|AKIA[0-9A-Z]{16}|BEGIN [A-Z]+ PRIVATE KEY'
    - op: REGEX
      field: execve.proc.argv
      value: '\.aws/credentials|\.pgpass'
action: alert
